name: ios
on:
  push:
    branches: [main]
    # Docs-only commits don't rebuild (a commit that also touches code or this workflow still runs).
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:
    inputs:
      req:
        description: "request tag (shown in the run title)"
        required: false
        default: ""
      only:
        description: "optional: run only these UI tests (comma-separated, e.g. DisciplineUITests/OuijaUITests)"
        required: false
        default: ""
      build_only:
        description: "true = skip the UI tests (compile check + IPAs only)"
        required: false
        default: "false"
run-name: "ios ${{ github.ref_name }} ${{ inputs.req }}"
# Read-only: this workflow never creates a GitHub Release (the repo is public; publishing a Release is
# Saidie's call). The IPA goes only to her private Hugging Face dataset.
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test-package:
    runs-on: xcode-27
    timeout-minutes: 110
    env:
      OUT: ${{ github.workspace }}/out
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          mkdir -p "$OUT"
          { xcodebuild -version; xcodebuild -showsdks | grep -i ios; sw_vers; } | tee "$OUT/toolchain.txt"

      - name: Fetch NCOM's private Ouija Board content (never committed to this public repo)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_OUT_REPO: ${{ vars.HF_OUT_REPO }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_OUT_REPO" ]; then echo "no private content source; building with neutral content"; exit 0; fi
          python3 -m pip install -q --break-system-packages huggingface_hub || python3 -m pip install -q huggingface_hub
          python3 - <<'PY' || echo "private content not fetched; building with neutral content"
          import os, shutil
          from huggingface_hub import hf_hub_download
          p = hf_hub_download(repo_id=os.environ["HF_OUT_REPO"], filename="discipline-private/ouija-content.json",
                              repo_type="dataset", token=os.environ["HF_TOKEN"])
          shutil.copy(p, "App/Resources/ouija-content.json")
          shutil.copy(p, "Ouija/Resources/ouija-content.json")
          print("private content copied:", os.path.getsize("App/Resources/ouija-content.json"), "bytes")
          PY

      - name: Install XcodeGen
        run: |
          curl -sSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xg
          /tmp/xg/xcodegen/bin/xcodegen --version
          /tmp/xg/xcodegen/bin/xcodegen generate
          ls

      - name: Liquid Glass check (native glass only, no fake materials)
        run: |
          set -o pipefail
          python3 scripts/check_liquid_glass.py | tee "$OUT/liquid-glass-check.txt"

      - name: Core logic tests (swift test)
        id: core
        working-directory: DisciplineCore
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$OUT/core-tests.log"

      - name: Pick simulator
        id: sim
        timeout-minutes: 15
        run: |
          xcrun simctl list runtimes
          # One screen only. A foldable like "iPhone Duo" has two displays, which breaks the screen
          # recorder and screenshots, so use (or create) a plain "iPhone NN Pro" on the newest iOS runtime.
          UDID=$(python3 - <<'PY' 2>>"$OUT/simulators.txt"
          import json, re, subprocess, sys
          j = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "-j"]))
          rts = [r for r in j["runtimes"] if r.get("isAvailable") and r.get("platform", "iOS") == "iOS" and "iOS" in r["name"]]
          rts.sort(key=lambda r: [int(x) for x in re.findall(r"\d+", r["version"])], reverse=True)
          def pro(name):
              m = re.match(r"iPhone (\d+) Pro$", name)
              return int(m.group(1)) if m else -1
          for rt in rts:
              devs = [d for d in j["devices"].get(rt["identifier"], []) if d.get("isAvailable", True) and pro(d["name"]) >= 0]
              if devs:
                  d = max(devs, key=lambda d: pro(d["name"]))
                  print(d["udid"]); print("using", d["name"], rt["name"], file=sys.stderr); sys.exit(0)
              types = [t for t in rt.get("supportedDeviceTypes", []) if pro(t["name"]) >= 0]
              if types:
                  t = max(types, key=lambda t: pro(t["name"]))
                  u = subprocess.check_output(["xcrun", "simctl", "create", "CI " + t["name"], t["identifier"], rt["identifier"]]).decode().strip()
                  print(u); print("created", t["name"], rt["name"], file=sys.stderr); sys.exit(0)
          # Fallback: any single-screen iPhone, newest runtime first.
          for rt in rts:
              for d in j["devices"].get(rt["identifier"], []):
                  if d["name"].startswith("iPhone") and not re.search(r"Duo|Fold|Flip", d["name"]):
                      print(d["udid"]); print("fallback", d["name"], rt["name"], file=sys.stderr); sys.exit(0)
          sys.exit("no usable iPhone simulator")
          PY
          )
          cat "$OUT/simulators.txt"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          # A simulator can hang while booting (CI #22 sat here 20+ min). Give it 4 min, then erase and boot once more.
          if ! perl -e 'alarm shift; exec @ARGV' 240 xcrun simctl bootstatus "$UDID" -b; then
            echo "simulator boot stuck; erasing and retrying once"
            xcrun simctl shutdown "$UDID" || true
            xcrun simctl erase "$UDID" || true
            xcrun simctl boot "$UDID" || true
            perl -e 'alarm shift; exec @ARGV' 420 xcrun simctl bootstatus "$UDID" -b
          fi
          xcrun simctl list devices | grep "$UDID" | tee -a "$OUT/toolchain.txt"

      - name: "UI tests: Discipline before Ouija is installed (Install Ouija to pair)"
        if: ${{ inputs.build_only != 'true' && inputs.only == '' }}
        timeout-minutes: 30
        run: |
          xcrun simctl uninstall "${{ steps.sim.outputs.udid }}" com.ncom.ouija || true
          scripts/run_uitests.sh pre-ouija Discipline "${{ steps.sim.outputs.udid }}" 1500 \
            -only-testing:DisciplineUITests/SignInWithOuijaUITests/testNoOuijaShowsInstallPrompt

      - name: "UI tests: Ouija app"
        if: ${{ inputs.build_only != 'true' && inputs.only == '' }}
        timeout-minutes: 50
        run: scripts/run_uitests.sh ouija Ouija "${{ steps.sim.outputs.udid }}" 2700

      - name: UI tests on the simulator (app flows with fixtures)
        if: ${{ inputs.build_only != 'true' }}
        timeout-minutes: 80
        run: |
          mkdir -p "$OUT/screenshots"
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force "$OUT/walkthrough.mp4" > "$OUT/recorder.log" 2>&1 &
          REC=$!
          # xcodebuild writes straight to a file (no pipe a lingering child could hold open).
          # TEST_RUNNER_-prefixed environment variables reach the UI test runner with the prefix removed.
          # A UI test that fails is run again (up to 2 more times) before the run counts it as failed:
          # the shared simulator sometimes stalls (query timeouts, a system sheet slow to appear).
          # Every retry is listed in the log and in retries.txt.
          ONLY_ARGS=""
          if [ -n "${{ inputs.only }}" ]; then
            for t in $(echo "${{ inputs.only }}" | tr ',' ' '); do ONLY_ARGS="$ONLY_ARGS -only-testing:$t"; done
            echo "running only: $ONLY_ARGS"
          fi
          TEST_RUNNER_SCREENSHOT_DIR="$OUT/screenshots" xcodebuild test -project Discipline.xcodeproj -scheme Discipline \
            -destination "id=$UDID" $ONLY_ARGS -skip-testing:DisciplineUITests/SignInWithOuijaUITests/testNoOuijaShowsInstallPrompt \
            -retry-tests-on-failure -test-iterations 3 \
            -resultBundlePath "$OUT/TestResults.xcresult" \
            CODE_SIGN_IDENTITY="-" > "$OUT/ui-tests.log" 2>&1 &
          XB=$!
          # Watchdog: once the suite has printed a final line AND the log has been quiet for 150 s
          # (retries print more), stop the video and xcodebuild.
          (
            LAST=0; QUIET=0
            while kill -0 $XB 2>/dev/null; do
              SIZE=$(wc -c < "$OUT/ui-tests.log")
              if [ "$SIZE" != "$LAST" ]; then LAST=$SIZE; QUIET=0; else QUIET=$((QUIET+10)); fi
              # Hard stop (CI #23 sat in this step 90+ min): the log quiet for 10 min before the suite ended means a stuck runner.
              if [ $QUIET -ge 600 ] && ! grep -qE "Test Suite 'All tests' (passed|failed)" "$OUT/ui-tests.log"; then
                kill -INT $REC 2>/dev/null || true
                echo "hard watchdog: the test log was quiet for 600 s before the suite ended; stopped xcodebuild (results are incomplete)" > "$OUT/watchdog-hard.txt"
                kill -TERM $XB 2>/dev/null || true; sleep 5; kill -KILL $XB 2>/dev/null || true
                exit 0
              fi
              if [ $QUIET -ge 150 ] && grep -qE "Test Suite 'All tests' (passed|failed)" "$OUT/ui-tests.log"; then
                kill -INT $REC 2>/dev/null || true
                # A marker file, not the log: xcodebuild's own final writes can overwrite a line appended to its log.
                echo "watchdog: xcodebuild still running with the log quiet for 150 s after the suite ended; stopped it" > "$OUT/watchdog.txt"
                kill -TERM $XB 2>/dev/null || true
                exit 0
              fi
              sleep 10
            done
          ) &
          WD=$!
          set +e
          wait $XB
          STATUS=$?
          kill $WD 2>/dev/null
          kill -INT $REC 2>/dev/null
          sleep 3
          set -e
          grep -E "Test Case .*(passed|failed)|error:|\*\* TEST|Executed|watchdog" "$OUT/ui-tests.log" || true
          set +e
          # Each test's LAST result decides (a retry that passes counts as passed, and is listed in retries.txt).
          python3 - "$OUT/ui-tests.log" "$OUT/retries.txt" <<'PY' > "$OUT/final-results.txt"
          import re, sys
          last, runs = {}, {}
          for m in re.finditer(r"Test Case '-\[(\S+) (\S+)\]' (passed|failed)", open(sys.argv[1], errors="ignore").read()):
              k = m.group(1) + "/" + m.group(2); last[k] = m.group(3); runs.setdefault(k, []).append(m.group(3))
          with open(sys.argv[2], "w") as r:
              for k, v in sorted(runs.items()):
                  if len(v) > 1: r.write(f"{k}: {' then '.join(v)}\n")
          for k, v in sorted(last.items()): print(v, k)
          print("TOTAL", len(last), "PASSED", sum(v == "passed" for v in last.values()))
          sys.exit(0 if last and all(v == "passed" for v in last.values()) else 1)
          PY
          FINAL=$?
          set -e
          cat "$OUT/final-results.txt"; echo "retries:"; cat "$OUT/retries.txt"
          if [ $STATUS -ne 0 ] && [ $FINAL -eq 0 ] && [ -f "$OUT/watchdog.txt" ]; then
            echo "every test's last result passed; xcodebuild exit $STATUS came from the watchdog stop"; STATUS=0
          fi
          if [ $FINAL -ne 0 ]; then STATUS=1; fi
          if [ -f "$OUT/watchdog-hard.txt" ]; then cat "$OUT/watchdog-hard.txt"; STATUS=1; fi
          perl -e 'alarm shift; exec @ARGV' 180 xcrun xcresulttool get test-results summary --path "$OUT/TestResults.xcresult" > "$OUT/test-summary.json" 2>/dev/null || true
          perl -e 'alarm shift; exec @ARGV' 180 xcrun xcresulttool get test-results tests --path "$OUT/TestResults.xcresult" > "$OUT/test-list.json" 2>/dev/null || true
          perl -e 'alarm shift; exec @ARGV' 180 xcrun xcresulttool export attachments --path "$OUT/TestResults.xcresult" --output-path "$OUT/attachments" || true
          cat "$OUT/test-summary.json" || true
          for f in pre-ouija ouija; do
            if [ -f "$OUT/$f-status.txt" ]; then echo "$f: $(cat "$OUT/$f-status.txt")"; cat "$OUT/$f-final-results.txt" || true
              if [ "$(cat "$OUT/$f-status.txt")" != PASS ]; then STATUS=1; fi; fi
          done
          echo "ui tests exit status: $STATUS"
          exit $STATUS

      - name: Build unsigned IPAs (Release, device)
        if: ${{ !cancelled() && steps.core.outcome == 'success' }}
        run: |
          set -o pipefail
          for APP in Discipline Ouija; do
            if [ "$APP" = Discipline ]; then VERSION=$(grep MARKETING_VERSION project.yml | head -1 | sed 's/.*"\(.*\)".*/\1/'); else VERSION=0.1.0; fi
            NAME="${APP}-v${VERSION}-unsigned.ipa"
            # perl alarm = a hard deadline (macOS has no GNU timeout); a hung compile shows its tail instead of eating the job.
            if ! perl -e 'alarm shift; exec @ARGV' 1500 xcodebuild -project Discipline.xcodeproj -scheme "$APP" -configuration Release \
              -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build -showBuildTimingSummary \
              OTHER_SWIFT_FLAGS='$(inherited) -Xfrontend -warn-long-function-bodies=400 -Xfrontend -warn-long-expression-type-checking=400' \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > "$OUT/build-$APP.log" 2>&1; then
              echo "BUILD FAILED or timed out: $APP"; grep -E "error:|BUILD FAILED" "$OUT/build-$APP.log" | sort -u | head -60
              echo "--- slow type-checking ---"; grep -E "took [0-9]+ms to type-check" "$OUT/build-$APP.log" | sort -u | head -20
              echo "--- log tail ---"; tail -40 "$OUT/build-$APP.log" | cut -c1-300; exit 1
            fi
            grep -E "took [0-9]+ms to type-check" "$OUT/build-$APP.log" | sort -u | head -20 || true
            grep -A25 "Build Timing Summary" "$OUT/build-$APP.log" | head -26 || true
            grep -E "warning:" "$OUT/build-$APP.log" | sort -u | head -15 || true
            rm -rf Payload && mkdir Payload
            cp -R "build/Build/Products/Release-iphoneos/$APP.app" Payload/
            zip -qry "$OUT/$NAME" Payload
            (cd "$OUT" && shasum -a 256 "$NAME" | tee "$NAME.sha256")
            echo "IPA_$APP=$NAME" >> "$GITHUB_ENV"
          done
          echo "IPA_NAME=$(ls "$OUT" | grep '^Discipline-v.*-unsigned.ipa$')" >> "$GITHUB_ENV"

      - name: Verify IPA
        if: ${{ !cancelled() && steps.core.outcome == 'success' }}
        run: |
          cd "$OUT"
          rm -rf verify && mkdir verify && cd verify
          unzip -q "../$IPA_NAME"
          test -d Payload/Discipline.app
          plutil -p Payload/Discipline.app/Info.plist | grep -E "CFBundleIdentifier|CFBundleShortVersionString|MinimumOSVersion|DTSDKName|DTXcode|com.apple.itunes.ipa|discipline" | tee ../ipa-verify.txt
          file Payload/Discipline.app/Discipline | tee -a ../ipa-verify.txt
          lipo -info Payload/Discipline.app/Discipline | tee -a ../ipa-verify.txt
          lipo -info Payload/Discipline.app/Discipline | grep -q arm64
          # No test fixture (or any other .ipa) may ship inside the app.
          IPAS=$(find Payload/Discipline.app -iname '*.ipa')
          if [ -n "$IPAS" ]; then echo "FAIL: .ipa files inside the app: $IPAS" | tee -a ../ipa-verify.txt; exit 1; fi
          echo "no .ipa inside the app: OK" | tee -a ../ipa-verify.txt
          plutil -p Payload/Discipline.app/Info.plist | grep -q '"CFBundleIconName" => "AppIcon"'
          N_ICON=$(xcrun assetutil --info Payload/Discipline.app/Assets.car 2>/dev/null | grep -c '"AppIcon' || true)
          echo "AppIcon renditions in Assets.car: $N_ICON" | tee -a ../ipa-verify.txt
          if [ "${N_ICON:-0}" -lt 1 ]; then echo "FAIL: no AppIcon in Assets.car (final icon Discipline-v64C missing)" | tee -a ../ipa-verify.txt; exit 1; fi
          ls -la Payload/Discipline.app | head -40 >> ../ipa-verify.txt
          codesign -dv Payload/Discipline.app 2>&1 | tee -a ../ipa-verify.txt || echo "unsigned (expected): Plume Impactor signs it" | tee -a ../ipa-verify.txt
          # Ouija: its own bundle id, ouija:// scheme, Live Activities, embedded widget extension, icon.
          rm -rf ../verify-ouija && mkdir ../verify-ouija && cd ../verify-ouija
          unzip -q "../$IPA_Ouija"
          P=Payload/Ouija.app
          plutil -p $P/Info.plist | grep -E "CFBundleIdentifier|CFBundleShortVersionString|NSSupportsLiveActivities|ouija|discipline" | tee -a ../ipa-verify.txt
          plutil -p $P/Info.plist | grep -q '"CFBundleIdentifier" => "com.ncom.ouija"'
          plutil -p $P/Info.plist | grep -q '"NSSupportsLiveActivities" => true'
          test -d $P/PlugIns/OuijaWidgets.appex && echo "widget extension embedded: OK" | tee -a ../ipa-verify.txt
          plutil -p $P/PlugIns/OuijaWidgets.appex/Info.plist | grep -q widgetkit-extension
          lipo -info $P/Ouija | tee -a ../ipa-verify.txt | grep -q arm64
          N_OI=$(xcrun assetutil --info $P/Assets.car 2>/dev/null | grep -c '"AppIcon' || true)
          echo "Ouija AppIcon renditions: $N_OI" | tee -a ../ipa-verify.txt
          if [ "${N_OI:-0}" -lt 1 ]; then echo "FAIL: Ouija has no AppIcon"; exit 1; fi
          plutil -p ../verify/Payload/Discipline.app/Info.plist | grep -A6 LSApplicationQueriesSchemes | grep -q ouija && echo "Discipline can query ouija://: OK" | tee -a ../ipa-verify.txt

      # Public repo: GitHub artifacts are visible to anyone, so they carry only the result summaries.
      # The IPA, screenshots, video and full logs (which show NCOM's private screens) go to the private
      # Hugging Face dataset in the next step.
      - name: Upload result summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discipline-${{ github.run_id }}-summary
          path: |
            out/final-results.txt
            out/*-final-results.txt
            out/*-status.txt
            out/retries.txt
            out/toolchain.txt
            out/ipa-verify.txt
            out/*.sha256
          retention-days: 14

      - name: Failing tests as annotations (readable through the API)
        if: always()
        run: |
          for f in "$OUT"/pre-ouija.log "$OUT"/ouija.log "$OUT"/ui-tests.log; do
            [ -f "$f" ] || continue
            MSG=$(grep -E "error: -\[" "$f" | sed -E 's#^.*/(UITests|OuijaUITests)/#\1/#' | sort -u | head -15 | tr '\n' '|' | sed 's/%/%25/g' | cut -c1-3500)
            [ -n "$MSG" ] && echo "::warning title=$(basename "$f")::$MSG"
          done
          true

      - name: Copy outputs to the private Hugging Face dataset (for Tab to read back)
        if: always()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_OUT_REPO: ${{ vars.HF_OUT_REPO }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_OUT_REPO" ]; then echo "no HF_TOKEN secret or HF_OUT_REPO variable; skipping"; exit 0; fi
          python3 -m pip install -q --break-system-packages huggingface_hub || python3 -m pip install -q huggingface_hub
          python3 - <<'PY'
          import os, glob
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          out = os.environ["OUT"]
          run = os.environ["GITHUB_RUN_ID"]
          keep = [p for p in glob.glob(out + "/*") if os.path.isfile(p) and not p.endswith(".xcresult")]
          keep += glob.glob(out + "/screenshots/*.png") + glob.glob(out + "/screenshots/*.txt")
          keep += [p for p in glob.glob(out + "/attachments/*") if p.endswith((".png", ".json"))]
          # One commit for the whole run (one commit per file hit the hub's commit rate limit), with retries.
          import time
          from huggingface_hub import CommitOperationAdd
          ops = [CommitOperationAdd(path_in_repo=f"runs/discipline-{run}/{os.path.relpath(p, out)}", path_or_fileobj=p) for p in keep]
          for attempt in range(6):
              try:
                  api.create_commit(repo_id=os.environ["HF_OUT_REPO"], repo_type="dataset", operations=ops,
                                    commit_message=f"discipline run {run}")
                  print("uploaded", len(ops), "files"); break
              except Exception as e:
                  print("upload attempt", attempt + 1, "failed:", str(e)[:300])
                  if attempt == 5: raise
                  time.sleep(30 * (attempt + 1))
          PY
