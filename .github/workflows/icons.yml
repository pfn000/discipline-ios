name: icons
# Builds the layered Liquid Glass app icons with Apple's own Icon Composer tool (ictool, bundled in Xcode)
# and checks that Xcode compiles the Discipline icon into the app. Runs only on the "icons" branch,
# so it never cancels or replaces the main app build.
on:
  push:
    branches: [icons]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: icons-${{ github.ref }}
  cancel-in-progress: true
jobs:
  icons:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      OUT: ${{ github.workspace }}/out
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode and find ictool
        run: |
          mkdir -p "$OUT/icons"
          XC=$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          { xcodebuild -version; xcodebuild -showsdks; } | tee "$OUT/toolchain.txt"
          IC="$XC/Contents/Applications/Icon Composer.app/Contents/Executables/ictool"
          test -x "$IC"
          "$IC" --version | tee -a "$OUT/toolchain.txt"
          echo "IC=$IC" >> "$GITHUB_ENV"
      - name: Fetch Jena's icon source (private; never committed to this public repo)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_OUT_REPO: ${{ vars.HF_OUT_REPO }}
        run: |
          python3 -m pip install -q --break-system-packages huggingface_hub || python3 -m pip install -q huggingface_hub
          python3 - <<'PY'
          import os, shutil
          from huggingface_hub import hf_hub_download
          for rel in ["icon.json", "Assets/Jena.png"]:
              p = hf_hub_download(repo_id=os.environ["HF_OUT_REPO"], filename=f"discipline-private/icons/Jena.icon/{rel}",
                                  repo_type="dataset", token=os.environ["HF_TOKEN"])
              dst = os.path.join("/tmp/private-icons/Jena.icon", rel)
              os.makedirs(os.path.dirname(dst), exist_ok=True)
              shutil.copy(p, dst)
          print("Jena.icon fetched")
          PY
      - name: Render every appearance with Icon Composer (ictool)
        run: |
          set +e
          FAIL=0
          for ICON in icons/Discipline.icon /tmp/private-icons/Jena.icon; do
            N=$(basename "$ICON" .icon)
            for R in Default Dark ClearLight ClearDark TintedLight TintedDark; do
              perl -e 'alarm shift; exec @ARGV' 120 "$IC" "$ICON" --export-image --output-file "$OUT/icons/$N-iOS-$R-1024.png" \
                --platform iOS --rendition $R --width 1024 --height 1024 --scale 1
              S=$?; echo "$N $R exit=$S" | tee -a "$OUT/icons/render-log.txt"; [ $S -eq 0 ] || FAIL=1
            done
            perl -e 'alarm shift; exec @ARGV' 120 "$IC" "$ICON" --export-image --output-file "$OUT/icons/$N-iOS-Default-gen26-1024.png" \
              --platform iOS --rendition Default --width 1024 --height 1024 --scale 1 --design-generation 26
            echo "$N Default gen26 exit=$?" | tee -a "$OUT/icons/render-log.txt"
            for PX in 180 120 87 58; do
              perl -e 'alarm shift; exec @ARGV' 60 "$IC" "$ICON" --export-image --output-file "$OUT/icons/$N-iOS-Default-$PX.png" \
                --platform iOS --rendition Default --width $PX --height $PX --scale 1
            done
          done
          ls -la "$OUT/icons"
          exit $FAIL
      - name: Compile both icons with Apple's asset compiler (actool)
        run: |
          for ICON in icons/Discipline.icon /tmp/private-icons/Jena.icon; do
            N=$(basename "$ICON" .icon)
            mkdir -p "/tmp/actool-$N"
            xcrun actool "$ICON" --compile "/tmp/actool-$N" --platform iphoneos --minimum-deployment-target 26.0 \
              --app-icon "$N" --output-partial-info-plist "/tmp/actool-$N/partial.plist" \
              --output-format human-readable-text 2>&1 | tee "$OUT/icons/actool-$N.txt"
            ls -la "/tmp/actool-$N" | tee -a "$OUT/icons/actool-$N.txt"
            test -f "/tmp/actool-$N/Assets.car"
          done
      - name: Wire the Discipline icon into the app and build it (simulator, unsigned)
        run: |
          rm -rf App/Resources/Assets.xcassets/AppIcon.appiconset
          cp -R icons/Discipline.icon App/Resources/AppIcon.icon
          curl -sSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xg
          /tmp/xg/xcodegen/bin/xcodegen generate
          grep -n "AppIcon.icon" Discipline.xcodeproj/project.pbxproj | tee "$OUT/icons/wiring-pbxproj.txt"
          set -o pipefail
          xcodebuild build -project Discipline.xcodeproj -scheme Discipline -configuration Release \
            -destination "generic/platform=iOS Simulator" -derivedDataPath /tmp/dd CODE_SIGNING_ALLOWED=NO \
            > "$OUT/icons/app-build.log" 2>&1 || { tail -60 "$OUT/icons/app-build.log"; exit 1; }
          APP=$(ls -d /tmp/dd/Build/Products/Release-iphonesimulator/Discipline.app)
          plutil -p "$APP/Info.plist" | sed -n '/CFBundleIcons/,/}/p' | tee "$OUT/icons/wiring-infoplist.txt"
          ls -la "$APP" | grep -iE "AppIcon|Assets.car" | tee -a "$OUT/icons/wiring-infoplist.txt"
          xcrun assetutil --info "$APP/Assets.car" > "$OUT/icons/wiring-assetutil.json" 2>&1 || true
          grep -c '"AppIcon' "$OUT/icons/wiring-assetutil.json" | sed 's/^/AppIcon renditions in Assets.car: /' | tee -a "$OUT/icons/wiring-infoplist.txt"
          grep -q CFBundleIcons "$OUT/icons/wiring-infoplist.txt"
      - name: Copy outputs to the private Hugging Face dataset
        if: always()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_OUT_REPO: ${{ vars.HF_OUT_REPO }}
        run: |
          python3 - <<'PY'
          import os, glob
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          out, run = os.environ["OUT"], os.environ["GITHUB_RUN_ID"]
          for p in [p for p in glob.glob(out + "/**", recursive=True) if os.path.isfile(p)]:
              rel = os.path.relpath(p, out)
              api.upload_file(path_or_fileobj=p, path_in_repo=f"runs/icons-{run}/{rel}",
                              repo_id=os.environ["HF_OUT_REPO"], repo_type="dataset")
              print("uploaded", rel)
          PY
