name: icons
# Builds the layered Liquid Glass app icons with Apple's own Icon Composer tool (ictool, bundled in Xcode)
# and checks that Xcode's asset compiler (actool) accepts them. Runs only on the "icons" branch,
# so it never cancels or replaces the main app build. Nothing here is wired into the app.
on:
  push:
    branches: [icons]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: icons-${{ github.ref }}
  cancel-in-progress: true
jobs:
  icons:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      OUT: ${{ github.workspace }}/out
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode and find ictool
        run: |
          mkdir -p "$OUT/icons" "$OUT/symbols"
          XC=$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          { xcodebuild -version; xcodebuild -showsdks; sw_vers; } | tee "$OUT/toolchain.txt"
          IC="$XC/Contents/Applications/Icon Composer.app/Contents/Executables/ictool"
          test -x "$IC"
          "$IC" --version | tee -a "$OUT/toolchain.txt"
          echo "IC=$IC" >> "$GITHUB_ENV"
      - name: Export SF Symbol apple.logo (system-drawn, not hand-drawn)
        run: |
          perl -e 'alarm shift; exec @ARGV' 300 xcrun swift scripts/export_symbol.swift "$OUT/symbols" 2>&1 | tee "$OUT/symbols/export-log.txt"
          ls -la "$OUT/symbols"
      - name: Fetch Jena's icon source (private; never committed to this public repo)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_OUT_REPO: ${{ vars.HF_OUT_REPO }}
        run: |
          python3 -m pip install -q --break-system-packages huggingface_hub || python3 -m pip install -q huggingface_hub
          python3 - <<'PY'
          import os, shutil
          from huggingface_hub import snapshot_download
          p = snapshot_download(repo_id=os.environ["HF_OUT_REPO"], repo_type="dataset", token=os.environ["HF_TOKEN"],
                                allow_patterns=["discipline-private/icons/v3/**"])
          src = os.path.join(p, "discipline-private/icons/v3")
          shutil.copytree(src, "/tmp/private-icons", dirs_exist_ok=True)
          print("private icons:", os.listdir("/tmp/private-icons"))
          PY
      - name: Render every appearance with Icon Composer (ictool)
        run: |
          set +e
          FAIL=0
          for ICON in icons/v3/*.icon icons/v3/test/*.icon /tmp/private-icons/*.icon; do
            [ -d "$ICON" ] || continue
            N=$(basename "$ICON" .icon)
            case "$ICON" in *test/*) SIZES="256"; FULL=0;; *) SIZES="1024 180 120 87 58"; FULL=1;; esac
            for R in Default Dark ClearLight ClearDark TintedLight TintedDark; do
              for PX in $SIZES; do
                perl -e 'alarm shift; exec @ARGV' 120 "$IC" "$ICON" --export-image --output-file "$OUT/icons/$N-iOS-$R-$PX.png" \
                  --platform iOS --rendition $R --width $PX --height $PX --scale 1
                S=$?; [ "$PX" = 1024 -o "$PX" = 256 ] && echo "$N $R $PX exit=$S" | tee -a "$OUT/icons/render-log.txt"; [ $S -eq 0 ] || FAIL=1
              done
            done
          done
          ls -la "$OUT/icons"
          exit $FAIL
      - name: Compile the icons with Apple's asset compiler (actool)
        run: |
          for ICON in icons/v3/*.icon /tmp/private-icons/*.icon; do
            [ -d "$ICON" ] || continue
            N=$(basename "$ICON" .icon)
            mkdir -p "/tmp/actool-$N"
            xcrun actool "$ICON" --compile "/tmp/actool-$N" --platform iphoneos --minimum-deployment-target 26.0 \
              --app-icon "$N" --output-partial-info-plist "/tmp/actool-$N/partial.plist" \
              --output-format human-readable-text 2>&1 | tee "$OUT/icons/actool-$N.txt"
            ls -la "/tmp/actool-$N" | tee -a "$OUT/icons/actool-$N.txt"
            test -f "/tmp/actool-$N/Assets.car"
          done
      - name: Copy outputs to the private Hugging Face dataset
        if: always()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_OUT_REPO: ${{ vars.HF_OUT_REPO }}
        run: |
          python3 - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          out, run = os.environ["OUT"], os.environ["GITHUB_RUN_ID"]
          api.upload_folder(folder_path=out, path_in_repo=f"runs/icons-{run}",
                            repo_id=os.environ["HF_OUT_REPO"], repo_type="dataset",
                            commit_message=f"icons run {run}")
          print("uploaded", sum(len(f) for _, _, f in os.walk(out)), "files")
          PY
