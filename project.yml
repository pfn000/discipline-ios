# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
name: Discipline
options:
  bundleIdPrefix: com.ncom
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  DisciplineCore:
    path: DisciplineCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "6"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Discipline:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: Shared/DisciplineShape.swift
    # Test fixtures (Sample/Tracked/Signed .ipa) are copied into Debug builds only, for the UI tests.
    # They are never in the shipped (Release) app; CI fails the build if any .ipa is found inside it.
    postCompileScripts:
      - name: "UI test fixtures (Debug only)"
        script: |
          if [ "${CONFIGURATION}" = "Debug" ]; then
            for f in Sample Tracked Signed; do
              cp "${SRCROOT}/DisciplineCore/Tests/DisciplineCoreTests/Fixtures/$f.ipa" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/$f.ipa"
            done
            echo "copied UI test fixtures into the Debug app"
          else
            echo "${CONFIGURATION}: no test fixtures in this app"
          fi
        inputFiles:
          - $(SRCROOT)/DisciplineCore/Tests/DisciplineCoreTests/Fixtures/Sample.ipa
          - $(SRCROOT)/DisciplineCore/Tests/DisciplineCoreTests/Fixtures/Tracked.ipa
          - $(SRCROOT)/DisciplineCore/Tests/DisciplineCoreTests/Fixtures/Signed.ipa
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Sample.ipa
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Tracked.ipa
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Signed.ipa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ncom.discipline
        PRODUCT_NAME: Discipline
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: DisciplineCore
  DisciplineUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ncom.discipline.uitests
        TEST_TARGET_NAME: Discipline
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Discipline
  # Ouija: NCOM's developer app (its own bundle id and ouija:// scheme). Shares DisciplineCore
  # (ring code, Ed25519 ring login, Sign-in-with-Ouija assertions) and Shared/ with Discipline.
  Ouija:
    type: application
    platform: iOS
    sources:
      - path: Ouija/Sources
      - path: Ouija/Resources
      - path: Shared
      - path: App/Sources/Model/OuijaContent.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ncom.ouija
        PRODUCT_NAME: Ouija
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Ouija/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: DisciplineCore
      - target: OuijaWidgets
        embed: true
  # The Live Activity (Dynamic Island + Lock Screen) for "<app> wants to sign in".
  OuijaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: OuijaWidgets
        excludes: ["Info.plist"]
      - path: Shared/OuijaSignInActivity.swift
      - path: Shared/ApproveSignInIntent.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ncom.ouija.widgets
        PRODUCT_NAME: OuijaWidgets
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: OuijaWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
  OuijaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OuijaUITests
      - path: UITests/DisciplineUITestCase.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ncom.ouija.uitests
        TEST_TARGET_NAME: Ouija
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Ouija
schemes:
  Discipline:
    build:
      targets:
        Discipline: all
        DisciplineUITests: [test]
    test:
      config: Debug
      targets:
        - DisciplineUITests
  Ouija:
    build:
      targets:
        Ouija: all
        OuijaUITests: [test]
    test:
      config: Debug
      targets:
        - OuijaUITests
